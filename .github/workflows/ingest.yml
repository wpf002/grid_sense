name: Data feed canary

# WHAT THIS DOES — and, importantly, what it does NOT do.
#
# A GitHub runner has no access to the data.db that a running GridSense instance
# serves from, so this workflow CANNOT refresh anyone's data. Refreshing is the
# job of the in-process scheduler (server/ingest/scheduler.ts), which runs the
# heavy pipelines on their own cadences inside the server that owns the DB file.
#
# What a cloud runner IS good for is catching upstream breakage early. Public
# feeds rot quietly: a county renames a field, an ISO moves an export behind a
# session cookie, an agency reshuffles a workbook. The ingest still "succeeds",
# with zero rows, and a scoring factor silently goes synthetic.
#
# So: run the pipelines against a scratch database, then assert each one cleared
# a row floor (scripts/check_feeds.ts). A failure here means a source changed
# shape, not that anyone's data is stale.

on:
  workflow_dispatch: {}          # manual "Run workflow" button
  schedule:
    - cron: "0 7 * * *"          # daily — fast feeds
    - cron: "0 8 1 * *"          # monthly 1st — ISO interconnection queues
    - cron: "0 9 1 1,4,7,10 *"   # quarterly — federal datasets

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --legacy-peer-deps

      # A scratch DB, built fresh. Nothing here is served to anyone; it exists
      # so the pipelines have somewhere to write while we watch what they return.
      - name: Build scratch database
        run: npx tsx scripts/expand_full_us.ts

      - name: Select pipelines for this schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 8 1 * *")        SRC="miso_queue,pjm_queue,ercot_queue,spp_queue,caiso_queue,nyiso_queue,isone_queue" ;;
            "0 9 1 1,4,7,10 *") SRC="eia860,fema_nri,lbnl_queue" ;;
            "0 7 * * *")        SRC="dc_news,edgar,wholesale_price" ;;
            *)                  SRC="dc_news,edgar,wholesale_price,pjm_queue,isone_queue" ;;
          esac
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Run ingest
        env:
          GRIDSENSE_SESSION_SECRET: ci
          GRIDSENSE_ADMIN_PASSWORD: ci
        run: npx tsx server/ingest/run_all.ts "${{ steps.pick.outputs.src }}"

      # The actual assertion. Exits non-zero if a feed returned no data, so the
      # workflow goes red instead of quietly passing on an empty result.
      - name: Check feeds returned data
        env:
          GRIDSENSE_SESSION_SECRET: ci
          GRIDSENSE_ADMIN_PASSWORD: ci
        run: npx tsx scripts/check_feeds.ts "${{ steps.pick.outputs.src }}"
